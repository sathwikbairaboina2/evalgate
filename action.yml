name: Evalgate
description: Run an agent eval suite on PR base and head, comment the score diff, and fail on regression.
author: Sathwik
branding:
  icon: check-circle
  color: green
inputs:
  suite:
    description: Path to the evalgate suite YAML, relative to the repository root.
    required: true
  base-ref:
    description: Git ref or SHA to compare against. Defaults to the pull request base SHA.
    required: false
    default: ""
  base-setup:
    description: Shell command run inside the base checkout before evaluating it (for example "npm ci").
    required: false
    default: ""
  min-delta:
    description: Override gate.minDelta.
    required: false
    default: ""
  alpha:
    description: Override gate.alpha.
    required: false
    default: ""
  case-threshold:
    description: Override gate.caseThreshold.
    required: false
    default: ""
  head-target-url:
    description: "For http targets: URL of the head deployment (passed as --target-url to the head run)."
    required: false
    default: ""
  base-target-url:
    description: "For http targets: URL of the base deployment (passed as --target-url to the base run)."
    required: false
    default: ""
  comment:
    description: Post or update the PR comment ("true" or "false").
    required: false
    default: "true"
  github-token:
    description: Token used to comment on the pull request.
    required: false
    default: ${{ github.token }}
outputs:
  regression:
    description: '"true" if the gate failed.'
    value: ${{ steps.compare.outputs.regression }}
  comment-path:
    description: Path of the rendered Markdown comment.
    value: ${{ steps.compare.outputs.comment-path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Build evalgate
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if [ ! -f dist/cli.js ]; then
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
        fi

    - name: Evaluate head
      shell: bash
      env:
        EVALGATE: ${{ github.action_path }}/dist/cli.js
        SUITE: ${{ inputs.suite }}
        HEAD_TARGET_URL: ${{ inputs.head-target-url }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/evaluate-head.sh"

    - name: Evaluate base
      shell: bash
      env:
        EVALGATE: ${{ github.action_path }}/dist/cli.js
        SUITE: ${{ inputs.suite }}
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha }}
        BASE_SETUP: ${{ inputs.base-setup }}
        BASE_TARGET_URL: ${{ inputs.base-target-url }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/evaluate-base.sh"

    - name: Compare
      id: compare
      shell: bash
      env:
        EVALGATE: ${{ github.action_path }}/dist/cli.js
        MIN_DELTA: ${{ inputs.min-delta }}
        ALPHA: ${{ inputs.alpha }}
        CASE_THRESHOLD: ${{ inputs.case-threshold }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/compare.sh"

    - name: Post PR comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        EVALGATE: ${{ github.action_path }}/dist/cli.js
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        FILE: ${{ steps.compare.outputs.comment-path }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/post-comment.sh"

    - name: Enforce gate
      if: steps.compare.outputs.regression == 'true'
      shell: bash
      run: |
        echo "::error::evalgate: regression beyond threshold (see the PR comment or job summary)"
        exit 1
